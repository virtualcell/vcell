name: CI/CD

# Two-tier CI to keep the common case fast while preserving regression coverage.
#
#   Tier 1 (every push, fast lane):   build  ->  fast-tests + quarkus-tests
#   Tier 2 (regression, heavy):       build  ->  regression-tests
#                                     runs only on non-draft PRs to master,
#                                     nightly on master, and in the merge queue.
#
# Key mechanics:
#   * "build" compiles the whole monorepo ONCE and runs the Python package tests
#     ONCE, then hands the compiled workspace (**/target) to downstream jobs as
#     an artifact. Test jobs run surefire directly (mvn ... surefire:test) and do
#     NOT recompile, so Fast drops from ~6 min (compile+test) to ~2-3 min (test).
#   * The slow integration suites (MathGen/SBML/SEDML_*/BSTS) no longer run on
#     every push. Open a PR as a *draft* to iterate in the fast lane; mark it
#     ready-for-review (or let the nightly run) to exercise the full regression.
#
# Tradeoff worth knowing: because draft-state is only visible on `pull_request`
# events, a ready PR that receives a new commit runs `build` twice for that SHA
# (once from the push-triggered fast lane, once from the pull_request-triggered
# regression run). Each build is ~5 min. A merge queue (merge_group) is the
# cleaner long-term answer and is already wired below.

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
  merge_group:
  schedule:
    # nightly full regression on master (07:00 UTC)
    - cron: '0 7 * * *'
  release:
    types: [published, edited]

# Supersede in-flight runs for the same ref instead of piling them up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  python-version: "3.10"

jobs:
  # ---------------------------------------------------------------------------
  # BUILD (once): compile everything, run the Python package tests, verify the
  # Docker image builds, and publish the compiled workspace for the test jobs.
  # ---------------------------------------------------------------------------
  build:
    name: build
    runs-on: ubuntu-22.04
    # Build whenever something downstream needs it: the push fast lane, the
    # merge queue, the nightly regression, or a non-draft PR. Draft-PR pushes
    # are covered by their own `push` event, so the pull_request event skips.
    if: >-
      github.event_name == 'push'
      || github.event_name == 'merge_group'
      || github.event_name == 'schedule'
      || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Python package tests run here ONCE (previously duplicated in all 8 jobs).
      - name: build vcell-cli-utils package
        run: |
          cd vcell-cli-utils
          poetry install
          poetry run python -m pytest

      - name: build vcell-admin package
        run: |
          cd docker/swarm/vcell-admin
          poetry install
          poetry run python -m pytest

      - name: build pythonCopasiOpt package
        run: |
          cd pythonCopasiOpt/vcell-opt
          poetry install
          poetry run python -m pytest

      - name: build pythonVtk package
        run: |
          cd pythonVtk
          poetry install
          poetry run python -m pytest

      - name: build vcutils package
        run: |
          cd python-utils
          poetry install
          poetry run python -m pytest

      - name: build python-restclient package
        run: |
          cd python-restclient
          poetry install
          poetry run python -m pytest

      - name: build vcelldata package
        run: |
          cd pythonData
          poetry install
          poetry run python -m pytest

      - name: setup java 17 with maven cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # -DskipTests compiles main AND test classes (and processes test resources)
      # but does not RUN tests. Installs module jars into ~/.m2 so downstream
      # surefire runs can resolve inter-module dependencies offline.
      - name: Maven build (compile + install, no tests)
        shell: bash
        run: |
          mvn -version
          java -version
          mvn --batch-mode clean install dependency:copy-dependencies -DskipTests=true

      - name: Test building of docker image
        run: |
          docker build \
            --file Dockerfile \
            .

      # Package the compiled workspace for the test jobs. Timestamps are kept so
      # Maven treats the classes as up-to-date and surefire:test won't recompile.
      - name: Package compiled workspace
        run: find . -type d -name target -prune -print0 | tar --posix --null -czf workspace-target.tar.gz --files-from -

      - name: Upload compiled workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-target
          path: workspace-target.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() }}

  # ---------------------------------------------------------------------------
  # TIER 1 - fast unit tests (every push). Reuses the compiled workspace; runs
  # surefire directly so there is no recompile.
  # ---------------------------------------------------------------------------
  fast-tests:
    name: CI-Test-group-Fast
    runs-on: ubuntu-22.04
    needs: build
    # Fast lane runs on ordinary pushes and in the merge queue. On a PR it is
    # already satisfied by the push-triggered run (checks attach by head SHA),
    # so it does not re-run on the pull_request event.
    if: ${{ github.event_name == 'push' || github.event_name == 'merge_group' }}
    steps:
      - uses: actions/checkout@v4

      - name: setup java 17 with maven cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Restore compiled workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-target

      - name: Unpack compiled workspace
        run: tar -xzf workspace-target.tar.gz

      # surefire:test runs ONLY the test goal - no compile, no clean.
      - name: Run Fast tests
        shell: bash
        run: mvn --batch-mode --offline surefire:test -Dgroups="Fast"

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() }}

  # ---------------------------------------------------------------------------
  # TIER 1 - Quarkus / vcell-rest tests + OpenAPI spec validation (every push).
  # ---------------------------------------------------------------------------
  quarkus-tests:
    name: CI-Test-group-Quarkus
    runs-on: ubuntu-22.04
    needs: build
    # Same fast-lane gating as fast-tests.
    if: ${{ github.event_name == 'push' || github.event_name == 'merge_group' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set Docker API version workaround
        run: echo "api.version=1.44" >> ~/.docker-java.properties

      - name: setup java 17 with maven cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Restore compiled workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-target

      - name: Unpack compiled workspace
        run: tar -xzf workspace-target.tar.gz

      - name: Validate OpenAPI spec
        run: ./tools/validate-openapi-spec.sh

      - name: Run Quarkus (vcell-rest) tests
        shell: bash
        run: mvn --batch-mode --offline -pl vcell-rest surefire:test

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() }}

  # ---------------------------------------------------------------------------
  # TIER 2 - heavy regression integration suites. NOT run on ordinary pushes.
  # Runs on: non-draft PRs to master, the nightly schedule, and the merge queue.
  # Keep a PR in *draft* to stay in the fast lane while iterating.
  # ---------------------------------------------------------------------------
  regression-tests:
    name: CI-Test-group-${{ matrix.test-group }}
    runs-on: ubuntu-22.04
    needs: build
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'merge_group'
      || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    strategy:
      matrix:
        test-group: [MathGen_IT, SBML_IT, SEDML_SBML_IT, SEDML_VCML_IT, BSTS_IT]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set Docker API version workaround
        run: echo "api.version=1.44" >> ~/.docker-java.properties

      - name: Install hdf5 tools needed for testing
        run: sudo apt -y update && sudo apt -y install hdf5-tools

      # Several IT groups (SED-ML, BSTS) shell out to the Python CLI utils, so
      # the Python runtime + packages are required here (unlike the fast lane).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: build vcell-cli-utils package
        run: |
          cd vcell-cli-utils
          poetry install

      - name: setup java 17 with maven cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Restore compiled workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-target

      - name: Unpack compiled workspace
        run: tar -xzf workspace-target.tar.gz

      - name: Run regression group ${{ matrix.test-group }}
        shell: bash
        run: mvn --batch-mode --offline surefire:test -Dgroups="${{ matrix.test-group }}"

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() }}

  # ---------------------------------------------------------------------------
  # CD - unchanged: build + push the biosimulators Docker image on release.
  # ---------------------------------------------------------------------------
  CD:
    name: CD
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'release' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: build vcell-cli-utils package
        run: |
          cd vcell-cli-utils
          poetry install
          poetry run python -m pytest

      - name: build vcell-admin package
        run: |
          cd docker/swarm/vcell-admin
          poetry install
          poetry run python -m pytest

      - name: build pythonCopasiOpt package
        run: |
          cd pythonCopasiOpt/vcell-opt
          poetry install
          poetry run python -m pytest

      - name: build pythonVtk package
        run: |
          cd pythonVtk
          poetry install
          poetry run python -m pytest

      - name: build vcutils package
        run: |
          cd python-utils
          poetry install
          poetry run python -m pytest

      - name: build python-restclient package
        run: |
          cd python-restclient
          poetry install
          poetry run python -m pytest

      - name: build vcelldata package
        run: |
          cd pythonData
          poetry install
          poetry run python -m pytest

      - name: setup java 17 with maven cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Get the VCell version from tags
        id: version
        run: echo ::set-output name=tag::$(echo ${GITHUB_REF:10})

      - name: Add Linux dependencies
        shell: bash
        run: |
          mvn -version
          java -version
          mvn --batch-mode clean install dependency:copy-dependencies -Dgroups="Fast"

      - name: Build Docker image and push with latest tag
        run: |
          set -ux
          REVISION=$(git rev-parse HEAD)
          CREATED=$(date --rfc-3339=seconds | sed 's/ /T/')
          sed -i 's/_VC_VERSION_TAG_/${{steps.version.outputs.tag}}/g' biosimulators.json
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build \
            --no-cache \
            --file Dockerfile \
            --build-arg SIMULATOR_VERSION=${{steps.version.outputs.tag}} \
            --tag ghcr.io/virtualcell/biosimulators_vcell:latest \
            --label org.opencontainers.image.revision=${REVISION} \
            --label org.opencontainers.image.created=${CREATED} \
            --label org.opencontainers.image.version=${{steps.version.outputs.tag}} \
            --label org.opencontainers.image.license=MIT \
            .
          docker tag ghcr.io/virtualcell/biosimulators_vcell:latest ghcr.io/virtualcell/biosimulators_vcell:${{steps.version.outputs.tag}}
          docker push --all-tags ghcr.io/virtualcell/biosimulators_vcell
      - name: Get release upload URL
        id: get_url
        uses: pdamianik/release-tag-to-upload-url-action@v1.0.1
        with:
          tag: ${{ steps.version.outputs.tag }}
          token: ${{ github.token }}
      - name: Upload edited specifications file
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ steps.get_url.outputs.uploadUrl }}
          asset_path: biosimulators.json

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() }}
