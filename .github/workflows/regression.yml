name: Regression

# Heavy integration suites (MathGen/SBML/SEDML_*/BSTS) plus the Oracle-dialect
# check (Oracle_IT). Deliberately NOT run on
# ordinary pushes - that is what keeps the fast lane (ci.yml) fast.
#
# Runs when:
#   * in the merge queue (the authoritative gate before landing on master),
#   * nightly on master (drift backstop),
#   * on demand via "Run workflow" (all groups or a single one, any ref),
#   * on every pull request - but there ONLY "regression-gate" runs, and it
#     passes at once without running any tests (see below).
#
# Why the pull_request trigger. "regression-gate" is a required status check,
# and GitHub only admits a PR to the merge queue once EVERY required check has
# reported on the PR's head commit. Without a pull_request trigger nothing ever
# reports it there, so enqueueing fails with 'Required status check
# "regression-gate" is expected.' and the only way to merge is an admin bypass.
# That is what happened from 2026-07-24 to 2026-11-23: the queue never ran once
# (zero merge_group runs) and every merge to master bypassed it. (An earlier
# claim here that GitHub does not "expect" a check no PR trigger produces was
# wrong.)
#
# So on a pull_request the shard jobs are skipped and regression-gate succeeds
# immediately - it marks the PR as eligible, it does not test it. The suite runs
# for real on the queue's merge commit (merge_group), and regression-gate there
# is what blocks a failing PR from landing. For an ad-hoc pre-queue check, use
# "Run workflow" on the PR branch.
#
# The slow groups are single parameterized tests iterating over the whole VCML
# model suite, so they are SHARDED across parallel runners: each shard runs a
# stride-partitioned slice of the cases (org.vcell.test.TestShard reads
# -Dtest.shard.count / -Dtest.shard.index). This brings the wall-clock of the
# slowest group from ~30 min down under ~10 min. A single "regression-gate" job
# aggregates all shards so the required-status-check name stays stable
# regardless of how the shard counts change.
#
# Each job compiles the monorepo itself (mvn install -Dgroups=...) rather than
# reusing ci.yml's build artifact: the suites are dominated by test time, and a
# self-contained job avoids a second "build" check colliding with ci.yml's in
# the merge queue.

on:
  merge_group:
  # Only to report regression-gate on the PR so it may enter the queue; see the header.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # nightly full regression on master (07:00 UTC)
    - cron: '0 7 * * *'
  # Manual on-demand run: all groups (default) or a single one.
  workflow_dispatch:
    inputs:
      test-group:
        description: 'Regression group to run'
        type: choice
        default: all
        options:
          - all
          - MathGen_IT
          - SBML_IT
          - SEDML_SBML_IT
          - SEDML_VCML_IT
          - BSTS_IT
          - Oracle_IT
      include-slow:
        description: 'Also run the slow cases excluded from the merge gate'
        type: boolean
        default: false

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  python-version: "3.10"

jobs:
  # ---------------------------------------------------------------------------
  # Compute the shard matrix. Slow groups are split into multiple shards; fast
  # groups run as a single shard. A manual dispatch may narrow to one group.
  # Each entry: {group, shard_index, shard_count, name}. Shard counts are sized
  # so no shard exceeds ~10 min (compile ~4 min + tests): the slowest groups
  # (SEDML_SBML ~31 min, MathGen ~27 min) get 5 shards, SEDML_VCML ~16 min gets
  # 3, and SBML/BSTS run whole.
  # ---------------------------------------------------------------------------
  prepare-regression:
    name: prepare regression matrix
    # Not on pull_request: there only regression-gate runs (see the header).
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - name: Compute regression shard matrix
        id: compute
        shell: bash
        env:
          SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.test-group || 'all' }}
        run: |
          python3 - "$SELECTED" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          selected = sys.argv[1]
          # Per group: shard count and the Maven module the tests live in. Scoping
          # the build to that module (-pl <module> -am) compiles a few modules
          # instead of all 14, roughly halving each shard's compile floor so more
          # shards fit under the ~20-job concurrency ceiling.
          CORE = "vcell-core"
          groups = {
              "MathGen_IT":    {"count": 4, "module": CORE},
              "SEDML_SBML_IT": {"count": 6, "module": CORE},
              "SEDML_VCML_IT": {"count": 2, "module": CORE},
              "SBML_IT":       {"count": 1, "module": CORE},
              # Geometry surface goldens over real corpus models. Not a model-suite
              # sweep and not slow (~3 s); it lives here rather than in the fast lane
              # because it depends on the VCML corpus resources and the natural way to
              # extend it is to add more models. See the README beside the goldens.
              "Geometry_IT":   {"count": 1, "module": CORE},
              "BSTS_IT":       {"count": 1, "module": "vcell-cli"},
              # Not a model-suite sweep: one Oracle container proving the database
              # cleanup sweep's SQL is accepted by the database it actually runs
              # against in production. Its PostgreSQL twin is in the fast lane
              # (vcell-rest), but Oracle needs its own ~2 GB image, so it is gated
              # here rather than pulled on every push. See issue #1992.
              "Oracle_IT":     {"count": 1, "module": "vcell-server"},
          }
          include = []
          for group, cfg in groups.items():
              if selected != "all" and group != selected:
                  continue
              count = cfg["count"]
              scope = f"-pl {cfg['module']} -am -Dmaven.dependency.analyze.skip=true"
              for i in range(count):
                  name = group if count == 1 else f"{group}-{i+1}of{count}"
                  include.append({
                      "group": group,
                      "shard_index": i,
                      "shard_count": count,
                      "name": name,
                      "scope": scope,
                  })
          print("matrix=" + json.dumps({"include": include}))
          PY

  # ---------------------------------------------------------------------------
  # Heavy integration suites, one job per (group, shard). Each compiles + runs
  # its shard's slice of the group.
  # ---------------------------------------------------------------------------
  regression-tests:
    name: CI-Test-group-${{ matrix.name }}
    runs-on: ubuntu-22.04
    needs: prepare-regression
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare-regression.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set Docker API version workaround
        run: echo "api.version=1.44" >> ~/.docker-java.properties

      # No `apt update` - the runner's package lists are fresh enough for this,
      # and the update refresh is the slow part.
      - name: Install hdf5 tools needed for testing
        run: sudo apt-get -y install hdf5-tools

      # Several IT groups (SED-ML, BSTS) shell out to the Python CLI utils.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Cache poetry virtualenvs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-venvs-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: build vcell-cli-utils package
        run: |
          cd vcell-cli-utils
          poetry install

      - name: setup java 17 with maven cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Run the slow (merge-gate-excluded) cases too on the nightly schedule and
      # when a manual dispatch asks for it, so those cases stay covered.
      - name: Maven build and run ${{ matrix.name }}
        shell: bash
        env:
          INCLUDE_SLOW: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.include-slow) }}
        run: |
          mvn -version
          java -version
          mvn --batch-mode clean install dependency:copy-dependencies \
            ${{ matrix.scope }} \
            -Dgroups="${{ matrix.group }}" \
            -Dtest.shard.count=${{ matrix.shard_count }} \
            -Dtest.shard.index=${{ matrix.shard_index }} \
            -Dtest.include.slow="${INCLUDE_SLOW}"

      # Surefire writes per-test-case timing (one row per parameterized model)
      # to these XMLs. Uploading them every run gives a full, current record of
      # every test's cost, so shards can be rebalanced from real data and new
      # slow tests spotted - without ever reproducing a shard by hand. Uploaded
      # even on failure so a timed-out/failed shard is still analyzable.
      - name: Upload surefire timing reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.name }}
          path: '**/target/surefire-reports/*.xml'
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Aggregate gate: succeeds only if every shard succeeded. This is the single
  # required status check for regression, so shard counts can change without
  # touching branch-protection rules.
  # ---------------------------------------------------------------------------
  regression-gate:
    name: regression-gate
    runs-on: ubuntu-22.04
    needs: regression-tests
    if: ${{ always() }}
    steps:
      - name: Verify all regression shards passed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Marks the PR eligible for the merge queue; the suite runs there, on the
            # merge commit, and this same job then reports its real result.
            echo "pull_request: regression runs in the merge queue, not here."
            exit 0
          fi
          result="${{ needs.regression-tests.result }}"
          echo "regression-tests result: $result"
          if [ "$result" != "success" ]; then
            echo "One or more regression shards did not succeed."
            exit 1
          fi
          echo "All regression shards passed."
