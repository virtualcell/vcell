[tool.poetry]
name = "vcell-cli-utils"
version = "0.7.2"
description = "Python utility package for VCell CLI Java App"
authors = ["Virtual Cell"]
license = "MIT"
repository = "https://github.com/virtualcell/vcell"
keywords = ["HDF5", "Visualization", "YAML", "Fire"]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: MIT License',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
]

# Only biosimulators_utils is imported by this package now; the plotting code that used fire,
# seaborn, matplotlib and pandas has been deleted. fire and seaborn are removed here because
# nothing else pulls them in. The rest are deliberately left alone: matplotlib, pandas, PyYAML,
# python-libcombine, python-libsbml-experimental and Deprecated all arrive transitively through
# biosimulators_utils anyway, and several carry deliberate pins (python-libcombine is fixed at
# 0.2.19 against biosimulators_utils' looser >=0.2.11) that removing would silently re-resolve.
[tool.poetry.dependencies]
python = "^3.10"
biosimulators_utils = "^0.2.3"
python-libcombine = "0.2.19"
PyYAML = "^6.0"
pandas = "^2.2"
matplotlib = "^3.5.2"
python-libsbml-experimental = "^5.20.1"
Deprecated = "^1.2.13"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
mypy = "^1.4.1"

[tool.poetry.group.dev.dependencies]
types-deprecated = "1.2.9.2"
types-PyYAML = "6.0.12.9"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
