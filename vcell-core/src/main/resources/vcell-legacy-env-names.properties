# Legacy container environment-variable names.
#
# The deployment supplies VCell configuration under short historical names -- dburl, serverid,
# jmshost_int_internal -- while the code asks for vcell.server.dbConnectURL and friends. This
# file is that mapping. EnvironmentConfigProvider consults it LAST, after the standard
# MicroProfile forms (vcell.server.id, vcell_server_id, VCELL_SERVER_ID), so a deployment can
# migrate one variable at a time by adding the modern name, which wins.
#
# Format is <vcell property name> = <environment variable name the deployment sets>.
#
# ORIGIN AND AUTHORITY. This was extracted from the -D flags in docker/build/Dockerfile-*-dev,
# which existed only to perform this renaming. Those flags are gone -- that was the point -- so
# those files are no longer the source of truth and this one is. The other end of the mapping
# now lives in vcell-fluxcd (kustomize/config/<overlay>/*.env), which this repository cannot
# see, so nothing here can verify that a name is still the one the deployment sets. What
# LegacyEnvironmentNamesTest can still check, and does: every property named here is declared in
# PropertyLoader, no alias duplicates what the standard rules already produce, and no two
# properties claim the same environment variable.
#
# Deleting an entry silently un-configures whatever it fed. Remove one only once vcell-fluxcd
# has stopped setting that name -- see virtualcell/vcell#1921 and virtualcell/vcell-fluxcd#28.

