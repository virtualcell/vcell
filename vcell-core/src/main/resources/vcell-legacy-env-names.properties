# Legacy container environment-variable names.
#
# Each VCell service container currently turns its environment into system properties with a
# wall of -D flags -- 84 of them, whose only job is to rename a value the container already
# has:
#
#     -Dvcell.server.dbConnectURL="${dburl}"
#
# That renaming is the reason the eight service Dockerfiles look bespoke when the images barely
# differ, and it is what stands in the way of running several services from one image. This file
# is that mapping, extracted from the Dockerfiles and stated once, so EnvironmentConfigProvider
# can do the renaming and the -D blocks can be deleted.
#
# Format is <vcell property name> = <environment variable name the deployment sets>.
#
# EnvironmentConfigProvider consults these names LAST, after the standard MicroProfile forms
# (vcell.server.id, vcell_server_id, VCELL_SERVER_ID). A deployment can therefore migrate one
# variable at a time by adding the modern name, which takes precedence; when nothing sets the
# legacy names any more, this file goes away.
#
# LegacyEnvironmentNamesTest re-derives this table from docker/build/Dockerfile-*-dev and fails
# if the two disagree -- so a new -D mapping cannot be added without an entry here.
#
# GENERATED from docker/build/Dockerfile-*-dev; edit alongside them.

